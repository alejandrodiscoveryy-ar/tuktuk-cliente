<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TUKTUK Cliente.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TUKTUK Cliente">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TUKTUK Cliente</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <script>
    // Turnstile is required only for an explicit notification opt-in.
    // Avoid a third-party request on every booking and map startup.
    window.tuktukLoadTurnstile = function () {
      if (window.turnstile) return Promise.resolve();
      if (window.tuktukTurnstileLoading) return window.tuktukTurnstileLoading;
      window.tuktukTurnstileLoading = new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        script.async = true;
        script.onload = function () { window.turnstile ? resolve() : reject(new Error('Verificación no disponible')); };
        script.onerror = function () { script.remove(); reject(new Error('No se pudo cargar la verificación')); };
        document.head.appendChild(script);
      }).catch(function (error) {
        window.tuktukTurnstileLoading = null;
        throw error;
      });
      return window.tuktukTurnstileLoading;
    };
    // The Turnstile site key is public and injected by Flutter --dart-define.
    // The SERVER must verify the token before registering an anonymous device.
    window.tuktukCustomerTurnstileProof = async function (siteKey) {
      await window.tuktukLoadTurnstile();
      return new Promise(function (resolve, reject) {
        if (!siteKey || !window.turnstile) {
          reject(new Error('Verificacion de alertas no disponible. Intenta de nuevo.'));
          return;
        }
        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;z-index:99999;bottom:12px;right:12px';
        document.body.appendChild(container);
        let widgetId = null;
        let finished = false;
        const timeoutId = window.setTimeout(function () {
          finish(null, new Error('Tiempo de verificacion agotado'));
        }, 110000);
        function finish(token, error) {
          if (finished) return;
          finished = true;
          window.clearTimeout(timeoutId);
          try { if (widgetId !== null) window.turnstile.remove(widgetId); } catch (_) {}
          container.remove();
          if (error) reject(error); else resolve(token);
        }
        try {
          widgetId = window.turnstile.render(container, {
            sitekey: siteKey,
            action: 'customer-rate-subscribe',
            appearance: 'interaction-only',
            callback: function (token) { finish(token, null); },
            'error-callback': function () { finish(null, new Error('Verificacion rechazada')); },
            'expired-callback': function () { finish(null, new Error('Verificacion caducada')); }
          });
        } catch (e) { finish(null, e); }
      });
    };
  </script>
  <script>
    // The Cliente service worker is confined to /cliente/tuk/.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          updateViaCache: 'none',
          scope: './'
        }).catch(function () {
          // Notification support is optional for the booking flow.
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
