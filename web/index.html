  <style>
    html, body { margin: 0; min-height: 100%; background: #050B10; color: #F3F8F7; }
    #tuktuk-startup { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: #050B10; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; transition: opacity 220ms ease; }
    #tuktuk-startup.tuktuk-startup-hidden { opacity: 0; pointer-events: none; }
    .tuktuk-startup-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px; }
    .tuktuk-startup-icon { width: 82px; height: 82px; object-fit: contain; }
    .tuktuk-startup-brand { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; font-size: clamp(30px, 8vw, 38px); font-weight: 900; letter-spacing: -1.9px; line-height: 1; }
    .tuktuk-startup-tuk-white { color: #FFFFFF; }
    .tuktuk-startup-tuk-gold { color: #E5A84E; }
    .tuktuk-startup-slogan { color: #D0D6DC; font-size: clamp(9px, 2.5vw, 11px); font-weight: 600; letter-spacing: .12em; white-space: nowrap; }
    .tuktuk-startup-spinner { box-sizing: border-box; margin-top: 12px; height: 28px; width: 28px; border-radius: 50%; border: 3px solid #1B3B39; border-top-color: #2DD4A3; animation: tuktuk-spin 0.85s linear infinite; }
    #tuktuk-startup-message { color: #93A2B5; font-size: 12px; max-width: 270px; line-height: 1.5; }
    #tuktuk-startup-retry { border: 1px solid #2DD4A3; background: transparent; color: #2DD4A3; padding: 10px 18px; border-radius: 12px; font: inherit; cursor: pointer; }
    #tuktuk-startup-retry[hidden] { display: none; }
    @keyframes tuktuk-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #tuktuk-startup { transition: none; } .tuktuk-startup-spinner { animation: none; border-top-color: #2DD4A3; } }
  </style>

<body>
  <div id="tuktuk-startup" role="status" aria-live="polite" aria-label="Iniciando TUKTUK Cliente">
    <div class="tuktuk-startup-inner">
      <img class="tuktuk-startup-icon" src="icons/Icon-192.png" width="82" height="82" alt="" decoding="async">
      <div class="tuktuk-startup-brand" aria-label="TUKTUK - Tu ciudad te mueve"><span class="tuktuk-startup-tuk-white">TUK</span><span class="tuktuk-startup-tuk-gold">TUK</span></div>
      <div class="tuktuk-startup-slogan">TU CIUDAD TE MUEVE</div>
      <div class="tuktuk-startup-spinner" aria-hidden="true"></div>
      <div id="tuktuk-startup-message">Iniciando la aplicacion...</div>
      <button type="button" id="tuktuk-startup-retry" hidden>Reintentar</button>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <script>
    // Turnstile is required only for an explicit notification opt-in.
    // Avoid a third-party request on every booking and map startup.
    window.tuktukLoadTurnstile = function () {
      if (window.turnstile) return Promise.resolve();
      if (window.tuktukTurnstileLoading) return window.tuktukTurnstileLoading;
      window.tuktukTurnstileLoading = new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        script.async = true;
        script.onload = function () { window.turnstile ? resolve() : reject(new Error('Verificación no disponible')); };
        script.onerror = function () { script.remove(); reject(new Error('No se pudo cargar la verificación')); };
        document.head.appendChild(script);
      }).catch(function (error) {
        window.tuktukTurnstileLoading = null;
        throw error;
      });
      return window.tuktukTurnstileLoading;
    };
    // The Turnstile site key is public and injected by Flutter --dart-define.
    // The SERVER must verify the token before registering an anonymous device.
    window.tuktukCustomerTurnstileProof = async function (siteKey) {
      await window.tuktukLoadTurnstile();
      return new Promise(function (resolve, reject) {
        if (!siteKey || !window.turnstile) {
          reject(new Error('Verificacion de alertas no disponible. Intenta de nuevo.'));
          return;
        }
        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;z-index:99999;bottom:12px;right:12px';
        document.body.appendChild(container);
        let widgetId = null;
        let finished = false;
        const timeoutId = window.setTimeout(function () {
          finish(null, new Error('Tiempo de verificacion agotado'));
        }, 110000);
        function finish(token, error) {
          if (finished) return;
          finished = true;
          window.clearTimeout(timeoutId);
          try { if (widgetId !== null) window.turnstile.remove(widgetId); } catch (_) {}
          container.remove();
          if (error) reject(error); else resolve(token);
        }
        try {
          widgetId = window.turnstile.render(container, {
            sitekey: siteKey,
            action: 'customer-rate-subscribe',
            appearance: 'interaction-only',
            callback: function (token) { finish(token, null); },
            'error-callback': function () { finish(null, new Error('Verificacion rechazada')); },
            'expired-callback': function () { finish(null, new Error('Verificacion caducada')); }
          });
        } catch (e) { finish(null, e); }
      });
    };
  </script>
  <script>
    // The Cliente service worker is confined to /cliente/tuk/.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          updateViaCache: 'none',
          scope: './'
        }).catch(function () {
          // Notification support is optional for the booking flow.
        });
      });
    }
  </script>

<script>
  (function () {
    'use strict';
    var splash = document.getElementById('tuktuk-startup');
    var message = document.getElementById('tuktuk-startup-message');
    var retry = document.getElementById('tuktuk-startup-retry');
    if (!splash || !message || !retry) return;

    var finished = false;
    var slowTimer = window.setTimeout(function () {
      if (finished) return;
      message.textContent = 'El inicio esta tardando. Comprueba tu conexion.';
      retry.hidden = false;
    }, 20000);

    retry.addEventListener('click', function () {
      window.location.reload();
    });

    window.addEventListener('flutter-first-frame', function () {
      if (finished) return;
      finished = true;
      window.clearTimeout(slowTimer);
      // Wait two paint opportunities before uncovering Flutter's first frame.
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          splash.classList.add('tuktuk-startup-hidden');
          splash.addEventListener('transitionend', function () {
            splash.remove();
          }, { once: true });
          window.setTimeout(function () { splash.remove(); }, 500);
        });
      });
    }, { once: true });
  }());
</script>
<!-- TUKTUK_STARTUP_SCRIPT_END -->
  <script src="flutter_bootstrap.js" async></script>
