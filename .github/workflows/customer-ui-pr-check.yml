name: Verificar TUKTUK Cliente UI
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/presentation/marketplace_customer_tracking.dart'
      - 'lib/presentation/marketplace_customer_booking_flow.dart'
      - 'lib/presentation/marketplace_vector_map.dart'
      - 'test/presentation/marketplace_tracking_mobile_ui_test.dart'
      - 'test/presentation/marketplace_map_route_glass_test.dart'
      - '.github/workflows/customer-ui-pr-check.yml'
      - 'web/**'
      - 'test/web/**'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Flutter 3.44.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Provision licensed TUKTUK arrival horn
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/sounds
          curl -fsSL --retry 3 --connect-timeout 20 'https://assets.mixkit.co/active_storage/sfx/719/719.wav' -o 'assets/sounds/tuktuk-car-double-horn.wav'
          echo '15c3836597e2b820a9543a1fa671d4b2691bca46ef98f7d4ca767936b5109ed0  assets/sounds/tuktuk-car-double-horn.wav' | sha256sum --check
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Check service workers syntax
        run: |
          node --check web/customer-cache-sw.js
          node --check web/firebase-messaging-sw.js
      - name: Build web release smoke
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release --base-href "/cliente/tuk/"
          test -f build/web/main.dart.js
          test -f build/web/customer-cache-sw.js
          test -f build/web/assets/assets/sounds/tuktuk-car-double-horn.wav
          test -f build/web/_headers
          du -h build/web/main.dart.js
