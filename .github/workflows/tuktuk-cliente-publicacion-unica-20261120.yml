name: Autorizar una publicación de TukTuk Cliente (temporal)
# Puente de una sola ejecución: la petición explícita del propietario fue aprobada
# el 20-11-2026. No habilita despliegues automáticos para cambios posteriores.
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/tuktuk-cliente-publicacion-unica-20261120.yml'

permissions:
  contents: read
  actions: write

jobs:
  iniciar-publicacion-manual:
    if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.added, '.github/workflows/tuktuk-cliente-publicacion-unica-20261120.yml') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Iniciar el workflow manual existente y confirmado
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "alejandrodiscoveryy-ar/tuktuk-cliente"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "${GH_TOKEN:-}"
          status="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/dispatch-response" -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-web-production.yml/dispatches" \
            -d '{"ref":"main","inputs":{"confirm_production":"true"}}')"
          echo "PUBLICACION_MANUAL_DISPATCH_HTTP=$status"
          test "$status" = "204"
          echo "PUBLICACION_MANUAL_SOLICITADA=OK"
